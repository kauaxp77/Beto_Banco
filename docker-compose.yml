# =============================================================================
# Stack completa em conteiner. Documento Mestre V4.0 -- Secao 23,
# "dev local -> staging com dado anonimizado -> prod".
#
#   docker compose up -d --build
#
#   Front .............. http://localhost:8090
#   API (direta) ....... http://localhost:8091/api/docs/ui
#   E-mail capturado ... http://localhost:8025
#
# O front e servido pelo nginx, que faz proxy de /api para a API: mesma origem,
# entao nao ha CORS no caminho. Em producao o front vai para a Vercel (secao 23)
# e ai sim o CORS_ORIGENS da API precisa listar o dominio.
#
# Portas de host escolhidas fora das usuais de proposito: 8080 costuma estar
# ocupada (Docker Desktop, Apache) e 5432 por um PostgreSQL local.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: plataforma-postgres
    environment:
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma
      POSTGRES_DB: plataforma
      # America/Sao_Paulo so na exibicao; o banco guarda tudo em UTC (secao 18).
      TZ: UTC
    ports:
      - '5433:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plataforma -d plataforma']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Secao 23: "Fila -- Redis: webhook, e-mail e IA fora do request".
    image: redis:7-alpine
    container_name: plataforma-redis
    ports:
      - '6379:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - dados-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # SMTP de desenvolvimento. Captura tudo e nao entrega nada -- um e-mail de
    # teste que chega de verdade na caixa de um aluno e um incidente de LGPD.
    image: axllent/mailpit:latest
    container_name: plataforma-mailpit
    ports:
      - '1025:1025'  # SMTP
      - '8025:8025'  # interface web para ler o que foi enviado
    environment:
      MP_MAX_MESSAGES: 500

  api:
    build:
      context: ./backend
    container_name: plataforma-api
    depends_on:
      # service_healthy, nao apenas started: o Flyway roda na subida da API e
      # falharia contra um PostgreSQL que ainda esta inicializando o cluster.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/plataforma
      DATABASE_USER: plataforma
      DATABASE_PASSWORD: plataforma
      REDIS_URL: redis://redis:6379
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Secao 21: segredo em variavel de ambiente ou cofre, nunca no repositorio.
      # Estes valores sao de desenvolvimento e nao servem para nenhum outro lugar.
      JWT_SECRET: ${JWT_SECRET:-segredo-local-de-desenvolvimento-com-mais-de-32-bytes-aqui}
      INFINITYPAY_WEBHOOK_SECRET: ${INFINITYPAY_WEBHOOK_SECRET:-segredo-webhook-local}
      INFINITYPAY_API_TOKEN: ${INFINITYPAY_API_TOKEN:-}
      # O front chega pelo nginx, mesma origem. A lista cobre o acesso direto a
      # API e o dev server do Vite rodando fora do conteiner.
      CORS_ORIGENS: http://localhost:8090,http://localhost:5173
      APP_URL: http://localhost:8090
      LOG_LEVEL: INFO
    ports:
      - '8091:8080'

  web:
    build:
      context: ./frontend-react
    container_name: plataforma-web
    depends_on:
      # service_healthy, e nao apenas started: a API leva cerca de um minuto para
      # subir, e o nginx aceitando trafego antes disso devolve 502 no login --
      # que parece defeito da aplicacao, quando e so ordem de inicializacao.
      api:
        condition: service_healthy
    ports:
      - '8090:80'

volumes:
  dados-postgres:
  dados-redis:
