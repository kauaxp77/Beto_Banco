# =============================================================================
# Documento Mestre V4.0 -- Secao 23, "Ambientes e entrega".
#
#   "CI no GitHub Actions: build -> testes -> analise estatica -> migracao ->
#    deploy. Deploy em producao so a partir da main, com rollback em um comando."
#
# Os quatro primeiros passos rodam em todo push e em toda PR. O deploy nao mora
# aqui: a Vercel publica o frontend por push (secao 23) e o backend sobe por
# container, e ambos exigem que este workflow esteja verde.
# =============================================================================
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  # Push novo no mesmo branch cancela a execucao anterior -- fila de CI parada
  # em commit velho e minuto de runner jogado fora.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend -- build, testes e migracao
    runs-on: ubuntu-latest

    services:
      # Secao 24: "Integracao -- API + banco real via Testcontainers". Onde o
      # Docker-in-Docker do runner atrapalha, este Postgres de servico cobre as
      # migracoes; o Testcontainers segue disponivel para os testes de API.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma
          POSTGRES_DB: plataforma
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plataforma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build e testes
        working-directory: backend
        run: mvn -B verify

      - name: Aplicar migracoes Flyway no banco limpo
        # Secao 23: a migracao roda antes do deploy. Aplicar em um banco vazio a
        # cada CI e o que pega migracao com erro de sintaxe ou dependente de
        # estado que so existe na maquina de quem escreveu.
        working-directory: backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/plataforma
          DATABASE_USER: plataforma
          DATABASE_PASSWORD: plataforma
        run: mvn -B flyway:migrate -Dflyway.url=$DATABASE_URL -Dflyway.user=$DATABASE_USER -Dflyway.password=$DATABASE_PASSWORD -Dflyway.locations=filesystem:src/main/resources/db/migration

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-backend
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend -- build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend-react
        run: npm ci

      - name: Build de producao
        working-directory: frontend-react
        run: npm run build

  seguranca:
    name: Analise estatica e dependencias
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: OWASP dependency-check
        # Secao 21: "Dependencias: dependabot + OWASP dependency-check no CI".
        # continue-on-error porque a base de CVE fica fora do ar com alguma
        # frequencia, e uma indisponibilidade dela nao pode travar o merge.
        continue-on-error: true
        working-directory: backend
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=8

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: npm audit
        continue-on-error: true
        working-directory: frontend-react
        run: npm audit --audit-level=high
