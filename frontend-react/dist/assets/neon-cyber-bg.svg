      <feMerge>
        <feMergeNode in="tint1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="reflectionBlur" x="-60%" y="-60%" width="220%" height="220%">
