<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03050a" />
      <stop offset="48%" stop-color="#060812" />
      <stop offset="100%" stop-color="#020307" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1a2d" />
      <stop offset="100%" stop-color="#07111d" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020305" stop-opacity="0" />
      <stop offset="100%" stop-color="#04070d" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0  0 0.35 0.75 0 0.95  0 0 1 0 1  0 0 0 1 0" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glowPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 0.35 0.6 0 0.25  0 0 1 0 0.65  0 0 0 1 0" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.08  0 1 0 0 0.95  0 0 1 0 0.35  0 0 0 1 0" />
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)" />
  <rect y="720" width="1600" height="280" fill="url(#floor)" />

  <g opacity="0.18">
