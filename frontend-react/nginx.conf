# =============================================================================
# nginx do conteiner do frontend. Serve o SPA e faz proxy de /api para a API.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anunciar a versao do nginx (secao 21 -- superficie de informacao).
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # API: mesma origem, sem preflight de CORS.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # A API usa X-Forwarded-For para o rate limit por IP (secao 19) e para o
        # registro de IP do titular (secao 22). Sem isto, todo mundo apareceria
        # com o IP do proprio nginx e o limite viraria global.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook do gateway pode demorar; o resto e rapido. 30 s cobre os dois
        # sem deixar conexao pendurada.
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # -------------------------------------------------------------------------
    # Estatico do build: nome com hash, entao o cache pode ser eterno.
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O service worker NAO pode ser cacheado: se ele ficar preso em uma versao
    # antiga, o navegador nunca descobre que existe uma nova (secao 09).
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Secao 21 -- cabecalhos de seguranca.
    # A CSP permite as fontes do Google (secao 06 usa Spectral e IBM Plex) e
    # o player do Panda Video (secao 10). YouTube nao entra na lista: e decisao
    # permanente da secao 31 nao usar.
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # O curinga de CSP só vale como rótulo mais à esquerda inteiro:
    # `player-vz-*.tv.pandavideo.com.br` é inválido e faz o navegador descartar a
    # diretiva frame-src inteira — ou seja, deixaria de proteger em vez de
    # proteger. `*.tv.pandavideo.com.br` cobre os mesmos hosts e é aceito.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' https://*.pandavideo.com.br https://*.tv.pandavideo.com.br; frame-src https://*.pandavideo.com.br https://*.tv.pandavideo.com.br; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # -------------------------------------------------------------------------
    # SPA: qualquer rota desconhecida devolve o index, e o React Router decide
    # -- inclusive a tela de 404 da secao 06.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
