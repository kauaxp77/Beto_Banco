spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/betobanco}
    username: ${DATABASE_USER:betobanco}
    password: ${DATABASE_PASSWORD:betobanco}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.betobanco: DEBUG
