spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/betobanco}
    username: ${DATABASE_USER:betobanco}
    password: ${DATABASE_PASSWORD:betobanco}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.betobanco: DEBUG

# O frontend novo (fase 4) roda em 5174; o legado, em 5173.
CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174

betobanco:
  auth:
    # Secao 10 -- protecao de conteudo: limite de dispositivos simultaneos
    # e alerta de conta compartilhada.
    max-active-sessions: 2
    alert-distinct-ips-24h: 4
    jwt-secret: ${JWT_SECRET:desenvolvimento-local-troque-isto-em-producao-32b}
    cookie-secure: false
  email:
    base-url: http://localhost:5173
  payments:
    fake-webhook-secret: segredo-de-teste
    # Secao 12 -- gateway oficial. Sem valor padrao de proposito: um segredo
    # embutido aqui seria publico e aceitaria webhook forjado.
    infinitypay-webhook-secret: ${INFINITYPAY_WEBHOOK_SECRET:}
    infinitypay:
      # Enderecos NOVOS do Checkout Integrado. Os antigos
      # (api.infinitepay.io/invoices/public/checkout/...) foram desativados
      # pelo provedor. Fica em configuracao para que a proxima migracao de
      # endereco seja uma variavel de ambiente, e nao um deploy.
      base-url: ${INFINITYPAY_CHECKOUT_URL:https://api.checkout.infinitepay.io}
      # InfiniteTag da conta que recebe. Sem ela o checkout recusa toda compra.
      handle: ${INFINITYPAY_HANDLE:}
      redirect-url: ${INFINITYPAY_REDIRECT_URL:http://localhost:5174/dashboard}
      webhook-url: ${INFINITYPAY_WEBHOOK_URL:}
      # Em desenvolvimento nao ha conta real para consultar, e exigir a
      # confirmacao deixaria o fluxo intestavel. Em producao fica true: e o que
      # impede um webhook forjado de liberar curso sem pagamento.
      confirmar-antes-de-liberar: ${INFINITYPAY_CONFIRMAR:false}
  essays:
    # Secao 14 -- a cota e o que mantem a margem da secao 04 de pe:
    # 4 correcoes mensais por 12 meses custam R$ 864 por aluno de mentoria,
    # contra um ticket de R$ 3.564.
    cota-mensal-mentoria: 4
