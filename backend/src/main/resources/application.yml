spring:
  application:
    name: beto-banco
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
