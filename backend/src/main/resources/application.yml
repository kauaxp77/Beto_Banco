spring:
  application:
    name: beto-banco
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

betobanco:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 30
    first-access-token-hours: 72
    reset-token-hours: 1
    cookie-secure: true
    cookie-same-site: Lax
